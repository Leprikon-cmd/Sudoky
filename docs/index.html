<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="Sudoky — a quiet path of clarity, patience, and inner peace.">
  <meta property="og:title" content="Sudoky — Way of the Sage">
  <meta property="og:description" content="Find stillness, one number at a time.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/app-icon.jpg">
  <title>Sudoky — Way of the Sage</title>
  <link rel="icon" href="assets/app-icon.jpg">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__content reveal">
        <img class="app-icon" src="assets/app-icon.jpg" alt="Sudoky app icon" width="176" height="176">
        <p class="eyebrow">Way of the Sage</p>
        <h1 id="hero-title">Sudoky</h1>
        <p class="tagline">Find stillness, one number at a time.</p>
        <div class="actions" aria-label="Download and project links">
          <a class="button button--primary" href="https://apps.apple.com/tr/app/sudoky/id6746160537" target="_blank" rel="noopener noreferrer">
            <span class="apple" aria-hidden="true">●</span>
            <span><small>Download on the</small>App Store</span>
          </a>
          <a class="button button--quiet" href="https://github.com/Leprikon-cmd/Sudoky" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </div>
      <a class="scroll-cue" href="#app" aria-label="See Sudoky">
        <span></span>
      </a>
    </section>

    <section class="showcase" id="app" aria-labelledby="showcase-title">
      <div class="showcase__heading reveal">
        <p class="eyebrow">Clarity. Patience. Peace.</p>
        <h2 id="showcase-title">A quieter way to play.</h2>
      </div>
      <div class="screens" aria-label="Sudoky app screenshots">
        <figure class="phone phone--side reveal">
          <img src="assets/screenshot-start.webp" alt="Sudoky path and player progress screen" width="600" height="1300" loading="lazy">
          <figcaption>Your path</figcaption>
        </figure>
        <figure class="phone phone--focus reveal">
          <img src="assets/screenshot-settings.webp" alt="Sudoky puzzle board in Master mode" width="600" height="1300" loading="lazy">
          <figcaption>The puzzle</figcaption>
        </figure>
        <figure class="phone phone--side reveal">
          <img src="assets/screenshot-game.webp" alt="Sudoky mindful progress statistics" width="600" height="1300" loading="lazy">
          <figcaption>Your progress</figcaption>
        </figure>
      </div>
      <p class="promise reveal">Made with care for people who love sudoku. Free, private, and distraction-free.</p>
    </section>
  </main>

  <footer class="footer">
    <nav aria-label="Footer">
      <a href="privacy.html">Privacy Policy</a>
      <a href="https://github.com/Leprikon-cmd/Sudoky" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
    <div class="footer__meta">
      <span>Version 2.0</span>
      <span>© 2025 Evgeny Zotchik</span>
    </div>
  </footer>
</body>
</html>
